<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أذكار الصباح والمساء</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tab Selector -->
    <div class="tab-container">
        <button class="tab-btn active" id="tab-morning" onclick="switchTab('morning')">☀️ أذكار الصباح</button>
        <button class="tab-btn" id="tab-evening" onclick="switchTab('evening')">🌙 أذكار المساء</button>
    </div>

    <!-- Edit Mode Toggle -->
    <button class="edit-toggle-btn" id="editToggle" onclick="toggleEditMode()">✏️ تعديل الترتيب</button>

    <!-- Book -->
    <div class="book-container" id="book"></div>

    <!-- Navigation -->
    <div class="nav-container">
        <button class="nav-arrow nav-next" id="btnNext" onclick="goToPage(currentPage + 1)">→</button>
        <div class="page-indicator" id="pageIndicator">١ / ١</div>
        <button class="nav-arrow nav-prev" id="btnPrev" onclick="goToPage(currentPage - 1)">←</button>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
