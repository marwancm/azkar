<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أذكاري</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <div>
                <p class="eyebrow">وردك اليومي</p>
                <h1>أذكاري</h1>
            </div>
            <button class="icon-button" id="resetProgress" type="button" aria-label="إعادة ضبط تقدم اليوم" title="إعادة ضبط تقدم اليوم">
                ↻
            </button>
        </header>

        <nav class="tabs" aria-label="أقسام الأذكار">
            <button class="tab active" type="button" data-category="morning">الصباح</button>
            <button class="tab" type="button" data-category="evening">المساء</button>
            <button class="tab" type="button" data-category="sleep">النوم</button>
        </nav>

        <section class="summary" aria-live="polite">
            <div>
                <span class="summary-label">القسم الحالي</span>
                <strong id="categoryTitle">أذكار الصباح</strong>
            </div>
            <div class="progress-ring" aria-label="نسبة الإنجاز">
                <span id="progressPercent">0%</span>
            </div>
        </section>

        <section class="dhikr-list" id="dhikrList" aria-label="قائمة الأذكار"></section>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
